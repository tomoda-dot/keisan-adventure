<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ナンバータッチ！1〜80 | けいさんアドベンチャー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Potta+One&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #fff0f6;
      --bg2: #e0f7fa;
      --bg3: #fff9c4;
      --pink: #ff6b9d;
      --pink-dark: #d81b60;
      --blue: #4fc3f7;
      --blue-dark: #0288d1;
      --yellow: #ffd54f;
      --mint: #69f0ae;
      --text: #3d2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg3) 50%, var(--bg2) 100%);
      color: var(--text);
    }

    .wrap {
      height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 2.5px solid #fff;
      background: rgba(255,255,255,0.92);
      color: var(--text);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }
    .pill-btn:active { transform: translateY(2px); }
    .pill-btn.sound-on { background: #fff3e0; border-color: #ffb74d; color: #e65100; }

    .game-title {
      font-family: 'Potta One', cursive;
      font-size: clamp(18px, 4vw, 26px);
      color: #ff4081;
      text-shadow: 2px 2px 0 #fff, 0 3px 6px rgba(255,64,129,0.2);
      text-align: center;
      white-space: nowrap;
    }

    /* HUD */
    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .hud-box {
      background: rgba(255,255,255,0.9);
      border: 2.5px solid #ffd1e3;
      border-radius: 16px;
      padding: 6px 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(255,107,157,0.12);
    }
    .hud-lbl { font-size: 10.5px; font-weight: 800; color: #8d6e63; }
    .hud-val { font-size: clamp(17px, 3.6vw, 22px); font-weight: 900; color: #d81b60; font-variant-numeric: tabular-nums; }
    .hud-box.timer .hud-val { color: #0288d1; }
    .hud-box.best .hud-val { color: #ef6c00; }

    /* Mode Selector Bar */
    .mode-bar {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .mode-chip {
      padding: 5px 10px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.8);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 800;
      color: #5d4037;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      transition: all 0.12s;
    }
    .mode-chip.active {
      background: linear-gradient(180deg, #ff80ab 0%, #ff4081 100%);
      color: #fff;
      box-shadow: 0 3px 0 #c51162;
    }

    /* Board Container */
    .board-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .board {
      display: grid;
      gap: var(--cell-gap, 6px);
      padding: 10px;
      background: rgba(255,255,255,0.72);
      border: 4px solid #fff;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.1);
      max-width: 100%;
      max-height: 100%;
    }

    .num-cell {
      width: var(--cell-size, 52px);
      height: var(--cell-size, 52px);
      border-radius: var(--cell-rad, 14px);
      border: 2.5px solid #fff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-weight: 900;
      font-size: var(--cell-font, 20px);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.16);
      transition: transform 0.1s, opacity 0.18s;
      position: relative;
    }
    .num-cell:active { transform: translateY(3px) scale(0.95); box-shadow: 0 1px 0 rgba(0,0,0,0.16); }

    .c-0 { background: linear-gradient(180deg, #ff80ab 0%, #ff4081 100%); box-shadow: 0 4px 0 #c51162; }
    .c-1 { background: linear-gradient(180deg, #4fc3f7 0%, #03a9f4 100%); box-shadow: 0 4px 0 #0277bd; }
    .c-2 { background: linear-gradient(180deg, #ffb74d 0%, #ff9800 100%); box-shadow: 0 4px 0 #e65100; }
    .c-3 { background: linear-gradient(180deg, #81c784 0%, #4caf50 100%); box-shadow: 0 4px 0 #2e7d32; }
    .c-4 { background: linear-gradient(180deg, #ba68c8 0%, #9c27b0 100%); box-shadow: 0 4px 0 #6a1b9a; }

    .num-cell.cleared {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.25);
    }
    .num-cell.wrong {
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-3deg); }
      75% { transform: translateX(5px) rotate(3deg); }
    }

    /* Overlay Screens */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(61, 44, 46, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }
    .overlay.hidden { display: none; }
    .modal-card {
      background: linear-gradient(180deg, #ffffff 0%, #fff8fb 100%);
      border: 4px solid #ffb2d0;
      border-radius: 28px;
      padding: 26px 22px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.22);
      animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-emoji { font-size: 52px; margin-bottom: 6px; }
    .modal-h {
      font-family: 'Potta One', cursive;
      font-size: 26px;
      color: #ff4081;
      margin-bottom: 8px;
    }
    .modal-p { font-size: 14px; font-weight: 700; color: #5d4037; line-height: 1.6; margin-bottom: 16px; }
    .result-time {
      font-size: 38px;
      font-weight: 900;
      color: #0288d1;
      margin: 6px 0;
      font-variant-numeric: tabular-nums;
    }
    .new-rec {
      display: inline-block;
      background: #ffca28;
      color: #4e342e;
      font-weight: 900;
      font-size: 13px;
      padding: 3px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

    .big-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(180deg, #ff80ab 0%, #ff4081 100%);
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #c51162;
      margin-top: 8px;
    }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c51162; }
    .sub-btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 14px;
      border: 2px solid #ffd1e3;
      background: #fff;
      color: #d81b60;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: none;
      display: inline-block;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="wrap">
    <div class="top-bar">
      <a href="index.html" class="pill-btn">🏠 TOP</a>
      <h1 class="game-title">✨ ナンバータッチ！</h1>
      <div style="display:flex;gap:6px;">
        <button id="btn-hint" class="pill-btn" onclick="toggleHint()">👀 ヒントON</button>
        <button id="btn-sound" class="pill-btn sound-on" onclick="toggleSound()">🎵 ON</button>
      </div>
    </div>

    <div class="mode-bar" id="mode-bar">
      <button class="mode-chip" data-mode="5x5_seq" onclick="selectMode('5x5_seq')">5×5 (1〜25)</button>
      <button class="mode-chip active" data-mode="5x5_rand80" onclick="selectMode('5x5_rand80')">5×5 (1〜80から)</button>
      <button class="mode-chip" data-mode="7x7_seq" onclick="selectMode('7x7_seq')">7×7 (1〜49)</button>
      <button class="mode-chip" data-mode="7x7_rand80" onclick="selectMode('7x7_rand80')">7×7 (1〜80から)</button>
      <button class="mode-chip" data-mode="8x10_80" onclick="selectMode('8x10_80')">ぜんぶ (1〜80)</button>
    </div>

    <div class="hud">
      <div class="hud-box">
        <div class="hud-lbl">つぎの すうじ</div>
        <div class="hud-val" id="hud-next">-</div>
      </div>
      <div class="hud-box timer">
        <div class="hud-lbl">タイム</div>
        <div class="hud-val" id="hud-time">0.00</div>
      </div>
      <div class="hud-box best">
        <div class="hud-lbl">ベスト</div>
        <div class="hud-val" id="hud-best">--.--</div>
      </div>
    </div>

    <div class="board-stage" id="board-stage">
      <div class="board" id="board"></div>
    </div>
  </div>

  <!-- Start Modal -->
  <div class="overlay" id="start-overlay">
    <div class="modal-card">
      <div class="modal-emoji">🎈</div>
      <div class="modal-h">ナンバータッチ！</div>
      <p class="modal-p">
        1〜80までの すうじが ランダムに ならぶよ！<br>
        <b>ちいさい じゅんばん</b> に タップして ぜんぶ けそう！
      </p>
      <button class="big-btn" onclick="startGame()">▶ スタート！</button>
      <a href="index.html" class="sub-btn">🏠 TOPページへもどる</a>
    </div>
  </div>

  <!-- Clear Modal -->
  <div class="overlay hidden" id="clear-overlay">
    <div class="modal-card">
      <div class="modal-emoji">🏆</div>
      <div class="modal-h">クリア おめでとう！</div>
      <div class="result-time" id="clear-time">0.00びょう</div>
      <div id="clear-new-rec" class="new-rec" style="display:none;">🎉 NEW RECORD!</div>
      <p class="modal-p" id="clear-msg">すばらしい スピードだね！</p>
      <button class="big-btn" onclick="startGame()">🔄 もういちど あそぶ</button>
      <a href="index.html" class="sub-btn">🏠 TOPページへもどる</a>
    </div>
  </div>

  <script>
    const BEST_KEY = 'NUMBER_TOUCH_BEST_V1';
    const MODES = {
      '5x5_seq':    { cols: 5,  rows: 5,  count: 25, maxNum: 25, label: '5×5 (1〜25)' },
      '5x5_rand80': { cols: 5,  rows: 5,  count: 25, maxNum: 80, label: '5×5 (1〜80から25個)' },
      '7x7_seq':    { cols: 7,  rows: 7,  count: 49, maxNum: 49, label: '7×7 (1〜49)' },
      '7x7_rand80': { cols: 7,  rows: 7,  count: 49, maxNum: 80, label: '7×7 (1〜80から49個)' },
      '8x10_80':    { cols: 10, rows: 8,  count: 80, maxNum: 80, label: 'ぜんぶ (1〜80)' }
    };

    let currentMode = '5x5_rand80';
    let sortedTargets = [];
    let targetIdx = 0;
    let startTime = 0;
    let timerRaf = null;
    let isPlaying = false;
    let soundOn = true;
    let showHint = true;
    let bestTimes = {};
    try { bestTimes = JSON.parse(localStorage.getItem(BEST_KEY) || '{}'); } catch(e) {}

    // ─── かわいいPOPな Web Audio BGM & SE ────────────────
    class PopAudio {
      constructor() {
        this.ctx = null;
        this.bgmTimer = null;
        this.step = 0;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      tone(freq, dur, type = 'sine', vol = 0.18, delay = 0) {
        if (!soundOn) return;
        this.init();
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }
      playPop(comboIdx) {
        const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.5];
        const f = scale[comboIdx % scale.length];
        this.tone(f, 0.12, 'triangle', 0.22);
        this.tone(f * 1.5, 0.09, 'sine', 0.12, 0.03);
      }
      playWrong() {
        this.tone(190, 0.14, 'sawtooth', 0.14);
        this.tone(150, 0.18, 'sawtooth', 0.12, 0.08);
      }
      playStart() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          this.tone(f, 0.12, 'triangle', 0.2, i * 0.07);
        });
      }
      playClear() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
        const times = [0, 0.1, 0.2, 0.3, 0.45, 0.56, 0.7];
        notes.forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.24, times[i]));
      }
      startBGM() {
        this.stopBGM();
        if (!soundOn) return;
        this.init();
        // かわいいマーチ風ピコピコループ
        const melody = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.0, 698.46];
        const bass   = [261.63, 0,      392.00, 0,      293.66, 0,     440.0, 0];
        this.step = 0;
        this.bgmTimer = setInterval(() => {
          if (!soundOn || !isPlaying) return;
          const idx = this.step % melody.length;
          this.tone(melody[idx], 0.16, 'sine', 0.045);
          if (bass[idx]) this.tone(bass[idx], 0.22, 'triangle', 0.04);
          this.step++;
        }, 230);
      }
      stopBGM() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }
    }
    const audio = new PopAudio();

    function toggleSound() {
      soundOn = !soundOn;
      const btn = document.getElementById('btn-sound');
      btn.textContent = soundOn ? '🎵 ON' : '🔇 OFF';
      btn.classList.toggle('sound-on', soundOn);
      if (soundOn && isPlaying) audio.startBGM();
      else audio.stopBGM();
    }

    function toggleHint() {
      showHint = !showHint;
      document.getElementById('btn-hint').textContent = showHint ? '👀 ヒントON' : '🙈 ヒントOFF';
      updateNextHud();
    }

    function updateNextHud() {
      const el = document.getElementById('hud-next');
      if (!isPlaying) { el.textContent = '-'; return; }
      el.textContent = showHint ? (sortedTargets[targetIdx] ?? '-') : '???';
    }

    function updateBestHud() {
      const b = bestTimes[currentMode];
      document.getElementById('hud-best').textContent = b ? b.toFixed(2) : '--.--';
    }

    function selectMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-chip').forEach(ch => {
        ch.classList.toggle('active', ch.dataset.mode === mode);
      });
      updateBestHud();
      if (isPlaying) {
        startGame();
      } else {
        layoutBoard();
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function layoutBoard() {
      const cfg = MODES[currentMode];
      const stage = document.getElementById('board-stage');
      const board = document.getElementById('board');
      const rect = stage.getBoundingClientRect();
      const isPortrait = rect.height > rect.width;
      const cols = isPortrait ? Math.min(cfg.cols, cfg.rows) : Math.max(cfg.cols, cfg.rows);
      const rows = isPortrait ? Math.max(cfg.cols, cfg.rows) : Math.min(cfg.cols, cfg.rows);
      const gap = Math.max(cols, rows) >= 9 ? 5 : (Math.max(cols, rows) >= 7 ? 5 : 7);
      const maxW = Math.floor((rect.width - 24 - gap * (cols - 1)) / cols);
      const maxH = Math.floor((rect.height - 24 - gap * (rows - 1)) / rows);
      const cellSize = Math.max(26, Math.min(maxW, maxH));
      const fontSize = Math.max(13, Math.floor(cellSize * 0.42));
      const radius = Math.max(6, Math.floor(cellSize * 0.24));

      board.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
      board.style.setProperty('--cell-size', cellSize + 'px');
      board.style.setProperty('--cell-gap', gap + 'px');
      board.style.setProperty('--cell-font', fontSize + 'px');
      board.style.setProperty('--cell-rad', radius + 'px');
    }

    function startGame() {
      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('clear-overlay').classList.add('hidden');
      stopConfetti();

      const cfg = MODES[currentMode];
      let pool = [];
      for (let n = 1; n <= cfg.maxNum; n++) pool.push(n);
      if (cfg.count < cfg.maxNum) {
        shuffle(pool);
        pool = pool.slice(0, cfg.count);
      }

      sortedTargets = pool.slice().sort((a, b) => a - b);
      const boardNums = shuffle(pool.slice());
      targetIdx = 0;

      layoutBoard();
      const board = document.getElementById('board');
      board.innerHTML = '';
      boardNums.forEach((num, idx) => {
        const btn = document.createElement('button');
        btn.className = 'num-cell c-' + (idx % 5);
        btn.textContent = num;
        btn.onclick = () => onCellTap(btn, num);
        board.appendChild(btn);
      });

      isPlaying = true;
      updateNextHud();
      updateBestHud();
      startTime = performance.now();
      if (timerRaf) cancelAnimationFrame(timerRaf);
      const tick = () => {
        if (!isPlaying) return;
        const sec = (performance.now() - startTime) / 1000;
        document.getElementById('hud-time').textContent = sec.toFixed(2);
        timerRaf = requestAnimationFrame(tick);
      };
      timerRaf = requestAnimationFrame(tick);

      audio.playStart();
      audio.startBGM();
    }

    function onCellTap(btn, num) {
      if (!isPlaying || btn.classList.contains('cleared')) return;
      const expected = sortedTargets[targetIdx];
      if (num === expected) {
        btn.classList.add('cleared');
        audio.playPop(targetIdx);
        targetIdx++;
        if (targetIdx >= sortedTargets.length) {
          finishGame();
        } else {
          updateNextHud();
        }
      } else {
        btn.classList.remove('wrong');
        void btn.offsetWidth;
        btn.classList.add('wrong');
        audio.playWrong();
      }
    }

    function finishGame() {
      isPlaying = false;
      audio.stopBGM();
      if (timerRaf) cancelAnimationFrame(timerRaf);
      const finalSec = (performance.now() - startTime) / 1000;
      document.getElementById('hud-time').textContent = finalSec.toFixed(2);
      document.getElementById('hud-next').textContent = '🎉';

      const prevBest = bestTimes[currentMode];
      const isNew = !prevBest || finalSec < prevBest;
      if (isNew) {
        bestTimes[currentMode] = finalSec;
        try { localStorage.setItem(BEST_KEY, JSON.stringify(bestTimes)); } catch(e) {}
      }
      updateBestHud();

      document.getElementById('clear-time').textContent = finalSec.toFixed(2) + ' びょう';
      document.getElementById('clear-new-rec').style.display = isNew ? 'inline-block' : 'none';
      document.getElementById('clear-msg').textContent = `${MODES[currentMode].label} を クリアしたよ！`;
      document.getElementById('clear-overlay').classList.remove('hidden');

      audio.playClear();
      startConfetti();
    }

    // ─── クリア時 紙吹雪演出 ────────────────────────────────
    let confettiPieces = [];
    let confettiRaf = null;
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#ff4081', '#4fc3f7', '#ffd54f', '#69f0ae', '#ba68c8', '#ff9800'];
      confettiPieces = Array.from({ length: 110 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: 8 + Math.random() * 8,
        h: 6 + Math.random() * 6,
        c: colors[Math.floor(Math.random() * colors.length)],
        vy: 2.5 + Math.random() * 4,
        vx: (Math.random() - 0.5) * 2.5,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.2
      }));
      const loop = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiPieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          if (p.y > canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        confettiRaf = requestAnimationFrame(loop);
      };
      loop();
    }
    function stopConfetti() {
      if (confettiRaf) cancelAnimationFrame(confettiRaf);
      confettiRaf = null;
      const canvas = document.getElementById('confetti-canvas');
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', layoutBoard);
    updateBestHud();
    layoutBoard();
  </script>
</body>
</html>
