<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>けいさんアドベンチャー | 学習アプリポータル</title>
  <meta name="description" content="たのしく学べる学習アプリポータル！ハチハチジュウロクなどいろいろなアプリであそぼう！">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap"
    rel="stylesheet">
  <script src="kawaii-mascots.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif;
      min-height: 100vh;
      background-color: #fff3f8;
      background-image:
        radial-gradient(rgba(255, 168, 204, 0.34) 3px, transparent 3px),
        radial-gradient(rgba(162, 221, 255, 0.34) 3px, transparent 3px);
      background-size: 36px 36px;
      background-position: 0 0, 18px 18px;
      color: #5d4752;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px 52px;
    }

    .portal-header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      border: 4px solid #ffd1e3;
      border-radius: 32px;
      padding: 20px 18px 18px;
      box-shadow: 0 10px 24px rgba(255, 143, 184, 0.18), inset 0 0 0 3px #fff5f9;
    }

    .portal-badge {
      display: inline-block;
      background: #ff8fb8;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 18px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #e06392;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .portal-title {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 900;
      font-size: clamp(26px, 5vw, 42px);
      color: #e05a8f;
      text-shadow: 2px 3px 0 #fff, 0 4px 10px rgba(224, 90, 143, 0.18);
      margin-bottom: 6px;
    }

    .portal-sub {
      font-size: 14.5px;
      font-weight: 800;
      color: #826272;
    }

    /* お出迎えキャラクター列 */
    .mascot-parade {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 14px;
      margin: 14px 0 6px;
      flex-wrap: wrap;
    }
    .mascot-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: transform 0.16s ease;
    }
    .mascot-chip:hover {
      transform: translateY(-6px) scale(1.06);
    }
    .mascot-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #ffd6e7;
      padding: 4px;
      box-shadow: 0 4px 10px rgba(255, 143, 184, 0.22);
    }
    .mascot-name {
      font-size: 11px;
      font-weight: 800;
      color: #a65c7a;
      background: #fff0f6;
      padding: 1px 8px;
      border-radius: 999px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #fff9db;
      border: 2.5px solid #ffe082;
      border-radius: 999px;
      padding: 7px 20px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 900;
      color: #8c5a2b;
      box-shadow: 0 4px 10px rgba(255, 193, 7, 0.14);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
      max-width: 980px;
      width: 100%;
    }

    .app-card {
      position: relative;
      background: #fff;
      border-radius: 28px;
      padding: 22px 20px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 4px solid #fff;
      box-shadow: 0 10px 22px rgba(224, 99, 146, 0.12);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      overflow: hidden;
    }

    .app-card.ready:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 28px rgba(224, 99, 146, 0.2);
    }

    .app-card.ready:active {
      transform: translateY(0);
    }

    /* サンリオ調ミルキーパステルカード */
    .app-card.theme-orange {
      background: linear-gradient(160deg, #fff9ec 0%, #ffe4d6 100%);
      border-color: #ffc2a8;
    }
    .app-card.theme-blue {
      background: linear-gradient(160deg, #f0f9ff 0%, #d4efff 100%);
      border-color: #a6dcff;
    }
    .app-card.theme-green {
      background: linear-gradient(160deg, #f0fdf8 0%, #d2f7e8 100%);
      border-color: #9de8cc;
    }
    .app-card.theme-cyan {
      background: linear-gradient(160deg, #eefcff 0%, #d1f4ff 100%);
      border-color: #9ce4fa;
    }
    .app-card.theme-red {
      background: linear-gradient(160deg, #fff2f6 0%, #ffd9e6 100%);
      border-color: #ffb3cd;
    }
    .app-card.theme-purple {
      background: linear-gradient(160deg, #f8f2ff 0%, #e8dbff 100%);
      border-color: #ceb5ff;
    }
    .app-card.theme-amber {
      background: linear-gradient(160deg, #fffdf0 0%, #fff0bd 100%);
      border-color: #ffe082;
    }
    .app-card.theme-teal {
      background: linear-gradient(160deg, #effcf9 0%, #cef5eb 100%);
      border-color: #96e4d2;
    }
    .app-card.theme-pink {
      background: linear-gradient(160deg, #fff0f7 0%, #ffd6ea 100%);
      border-color: #ffa8d1;
    }
    .app-card.theme-indigo {
      background: linear-gradient(160deg, #f2f4ff 0%, #dce2ff 100%);
      border-color: #b5c2ff;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(224, 99, 146, 0.12);
      flex-shrink: 0;
      position: relative;
    }
    .card-mini-mascot {
      position: absolute;
      right: -8px;
      bottom: -8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #ffd1e3;
      padding: 2px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .card-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #d6578a;
      margin-bottom: 4px;
    }

    .card-title {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 900;
      font-size: 20px;
      color: #6b4356;
      line-height: 1.25;
    }

    .card-desc {
      font-size: 13px;
      font-weight: 700;
      color: #785b68;
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px 16px;
      border-radius: 999px;
      border: 2.5px solid #fff;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      background: #ff8fb8;
      box-shadow: 0 4px 0 #e06392;
    }
  </style>
</head>

<body>
  <header class="portal-header">
    <div class="portal-badge">🎀 ゆめかわ けいさん・まなび ポータル</div>
    <h1 class="portal-title">冒険アプリランド</h1>
    <p class="portal-sub">なかよしキャラといっしょに、あそびたいアプリをえらんでね♪</p>
    <div class="mascot-parade" id="mascot-parade"></div>
    <div class="status-pill" id="portal-stats" style="display:none;">
      <span id="st-coins">🪙 0</span>
      <span id="st-stars">⭐ 0</span>
      <span id="st-solved">🎯 0もん</span>
    </div>
  </header>

  <main class="app-grid" id="app-grid"></main>

  <script>
    const APPS = [
      {
        id: '8816',
        tag: 'たしざん・ひきざん',
        title: 'ハチハチジュウロク',
        desc: '1けた〜くりあがり・くりさがりまで！楽しくスピード計算マスターを目指そう！',
        icon: '🧮',
        mascot: 'mimi',
        url: '8816.html',
        theme: 'theme-orange',
        ready: true
      },
      {
        id: 'number-touch',
        tag: 'スピード・しゅうちゅう',
        title: 'ナンバータッチ！',
        desc: '1〜80の数字を小さい順にタップ！5×5・7×7・ぜんぶ(80)のタイムアタックに挑戦しよう！',
        icon: '🔢',
        mascot: 'fuwawan',
        url: 'number-touch.html',
        theme: 'theme-blue',
        ready: true
      },
      {
        id: 'compare-game',
        tag: 'かずのおおきさ',
        title: 'くらべっこ！ ＞ ＝ ＜',
        desc: 'ひだりと みぎを くらべて「＞」「＝」「＜」をえらぼう！計算問題もあるよ！',
        icon: '⚖️',
        mascot: 'pomkuma',
        url: 'compare-game.html',
        theme: 'theme-green',
        ready: true
      },
      {
        id: 'seesaw-game',
        tag: 'つりあい・たしざん',
        title: 'つりあいシーソー！',
        desc: 'おもりをのせて シーソーを ぴったり水平にしよう！あといくつかな？',
        icon: '🎠',
        mascot: 'fuwawan',
        url: 'seesaw-game.html',
        theme: 'theme-cyan',
        ready: true
      },
      {
        id: 'monster-battle',
        tag: '連打・かずのぶんかい',
        title: 'ぴったりアタック！',
        desc: '+1・+5・+10ボタンを連打してモンスターのHPをぴったり0にしよう！',
        icon: '⚔️',
        mascot: 'mimi',
        url: 'monster-battle.html',
        theme: 'theme-red',
        ready: true
      },
      {
        id: 'bubble-pop',
        tag: 'かずの大小・ぐうき・10',
        title: 'かずバブル！',
        desc: 'ふわふわ浮かぶ数字のシャボン玉をお題にあわせてタップして割ろう！',
        icon: '🫧',
        mascot: 'milk',
        url: 'bubble-pop.html',
        theme: 'theme-purple',
        ready: true
      },
      {
        id: 'coin-place',
        tag: 'くらいどり・10のまとまり',
        title: 'コインで100！',
        desc: '1コインを連打して10・100に進化させよう！おつかいミッションもあるよ！',
        icon: '🪙',
        mascot: 'pomkuma',
        url: 'coin-place.html',
        theme: 'theme-amber',
        ready: true
      },
      {
        id: 'clock-game',
        tag: 'とけい・じかん',
        title: 'とけいマスター！',
        desc: 'アナログ時計の針をまわして、お題の時間にぴったり合わせよう！',
        icon: '🕒',
        mascot: 'mimi',
        url: 'clock-game.html',
        theme: 'theme-teal',
        ready: true
      },
      {
        id: 'dagashi-shop',
        tag: 'おかね・おつり',
        title: 'だがしや おかいもの！',
        desc: 'お菓子の合計とおつりを計算して、レジのトレイにお金を並べよう！',
        icon: '🍬',
        mascot: 'milk',
        url: 'dagashi-shop.html',
        theme: 'theme-pink',
        ready: true
      },
      {
        id: 'area-blocks',
        tag: 'ずけい・ひろさ',
        title: 'ひろさパズル！',
        desc: 'いろいろな形のブロックを方眼マスにならべて、お題の広さを作ろう！',
        icon: '🟦',
        mascot: 'fuwawan',
        url: 'area-blocks.html',
        theme: 'theme-indigo',
        ready: true
      }
    ];

    // お出迎えキャラ描画
    const parade = document.getElementById('mascot-parade');
    if (window.KAWAII_MASCOTS) {
      parade.innerHTML = Object.entries(window.KAWAII_MASCOTS).map(([k, m]) => `
        <div class="mascot-chip" title="${m.name}">
          <div class="mascot-avatar">${m.svg}</div>
          <span class="mascot-name">${m.name}</span>
        </div>
      `).join('');
    }

    // アプリカード描画
    const grid = document.getElementById('app-grid');
    grid.innerHTML = APPS.map(app => {
      const mSvg = (window.KAWAII_MASCOTS && window.KAWAII_MASCOTS[app.mascot]) ? window.KAWAII_MASCOTS[app.mascot].svg : '';
      return `
        <a href="${app.url}" class="app-card ready ${app.theme}">
          <div>
            <div class="card-top">
              <div class="card-icon">
                ${app.icon}
                ${mSvg ? `<div class="card-mini-mascot">${mSvg}</div>` : ''}
              </div>
              <div>
                <span class="card-tag">${app.tag}</span>
                <div class="card-title">${app.title}</div>
              </div>
            </div>
            <p class="card-desc">${app.desc}</p>
          </div>
          <div class="card-btn">🎀 あそぶ！</div>
        </a>
      `;
    }).join('');

    // 共通セーブデータがあればステータス表示
    try {
      const raw = localStorage.getItem('KEISAN_ADVENTURE_SAVE_V1');
      if (raw) {
        const st = JSON.parse(raw);
        document.getElementById('st-coins').textContent = '🪙 ' + (st.coins || 0);
        document.getElementById('st-stars').textContent = '⭐ ' + (st.stars || 0);
        document.getElementById('st-solved').textContent = '🎯 ' + (st.totalSolved || 0) + 'もん';
        document.getElementById('portal-stats').style.display = 'inline-flex';
      }
    } catch (e) { }
  </script>
</body>

</html>
