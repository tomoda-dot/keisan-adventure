<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>けいさんアドベンチャー | 学習アプリポータル</title>
  <meta name="description" content="たのしく学べる学習アプリポータル！ハチハチジュウロクなどいろいろなアプリであそぼう！">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Potta+One&family=Zen+Maru+Gothic:wght@700;900&family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 50%, #ffe0b2 100%);
      color: #2d3436;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px 48px;
    }

    .portal-header {
      text-align: center;
      margin-bottom: 28px;
      max-width: 820px;
      width: 100%;
    }

    .portal-badge {
      display: inline-block;
      background: #ff9800;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 16px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #e65100;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .portal-title {
      font-family: 'Potta One', 'Zen Maru Gothic', sans-serif;
      font-size: clamp(28px, 5vw, 44px);
      color: #e65100;
      text-shadow: 2px 3px 0 #fff, 0 5px 10px rgba(0, 0, 0, 0.12);
      margin-bottom: 8px;
    }

    .portal-sub {
      font-size: 15px;
      font-weight: 700;
      color: #5d4037;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ffe082;
      border-radius: 999px;
      padding: 8px 20px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #4e342e;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
      max-width: 960px;
      width: 100%;
    }

    .app-card {
      position: relative;
      background: #fff;
      border-radius: 24px;
      padding: 24px 22px 22px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 4px solid #fff;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      overflow: hidden;
    }

    .app-card.ready:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15);
    }

    .app-card.ready:active {
      transform: translateY(0);
    }

    .app-card.theme-orange {
      background: linear-gradient(160deg, #fff8e1 0%, #ffe0b2 100%);
      border-color: #ffb74d;
    }

    .app-card.theme-blue {
      background: linear-gradient(160deg, #e3f2fd 0%, #bbdefb 100%);
      border-color: #90caf9;
    }

    .app-card.theme-green {
      background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 100%);
      border-color: #a5d6a7;
    }

    .app-card.theme-cyan {
      background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 100%);
      border-color: #80deea;
    }

    .app-card.theme-red {
      background: linear-gradient(160deg, #ffebee 0%, #ffcdd2 100%);
      border-color: #ef9a9a;
    }

    .app-card.theme-purple {
      background: linear-gradient(160deg, #f3e5f5 0%, #e1bee7 100%);
      border-color: #ce93d8;
    }

    .app-card.theme-amber {
      background: linear-gradient(160deg, #fffbeb 0%, #fde68a 100%);
      border-color: #fbbf24;
    }
    .app-card.theme-teal {
      background: linear-gradient(160deg, #e0f2f1 0%, #b2dfdb 100%);
      border-color: #4db6ac;
    }
    .app-card.theme-pink {
      background: linear-gradient(160deg, #fce4ec 0%, #f8bbd0 100%);
      border-color: #f48fb1;
    }
    .app-card.theme-indigo {
      background: linear-gradient(160deg, #e8eaf6 0%, #c5cae9 100%);
      border-color: #7986cb;
    }

    .app-card.coming-soon {
      opacity: 0.72;
      cursor: default;
      border-style: dashed;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .card-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      color: #e65100;
      margin-bottom: 4px;
    }

    .card-title {
      font-family: 'Potta One', 'Zen Maru Gothic', sans-serif;
      font-size: 22px;
      color: #bf360c;
      line-height: 1.25;
    }

    .coming-soon .card-title {
      color: #455a64;
    }

    .coming-soon .card-tag {
      color: #546e7a;
    }

    .card-desc {
      font-size: 13.5px;
      font-weight: 700;
      color: #5d4037;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .coming-soon .card-desc {
      color: #607d8b;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(180deg, #ff9800 0%, #f57c00 100%);
      box-shadow: 0 4px 0 #e65100;
    }

    .coming-soon .card-btn {
      background: #b0bec5;
      box-shadow: 0 4px 0 #78909c;
    }
  </style>
</head>

<body>
  <header class="portal-header">
    <div class="portal-badge">✨ けいさん・まなび ポータル</div>
    <h1 class="portal-title">冒険アプリランド</h1>
    <p class="portal-sub">あそびたいアプリをえらんでね！</p>
    <div class="status-pill" id="portal-stats" style="display:none;">
      <span id="st-coins">🪙 0</span>
      <span id="st-stars">⭐ 0</span>
      <span id="st-solved">🎯 0もん</span>
    </div>
  </header>

  <main class="app-grid" id="app-grid"></main>

  <script>
    // アプリ一覧（ここに新しいアプリを追加できます）
    const APPS = [
      {
        id: '8816',
        tag: 'たしざん・ひきざん',
        title: 'ハチハチジュウロク',
        desc: '1けた〜くりあがり・くりさがりまで！楽しくスピード計算マスターを目指そう！',
        icon: '🧮',
        url: '8816.html',
        theme: 'theme-orange',
        ready: true
      },
      {
        id: 'number-touch',
        tag: 'スピード・しゅうちゅう',
        title: 'ナンバータッチ！',
        desc: '1〜80の数字を小さい順にタップ！5×5・7×7・ぜんぶ(80)のタイムアタックに挑戦しよう！',
        icon: '🔢',
        url: 'number-touch.html',
        theme: 'theme-blue',
        ready: true
      },
      {
        id: 'compare-game',
        tag: 'かずのおおきさ',
        title: 'くらべっこ！ ＞ ＝ ＜',
        desc: 'ひだりと みぎを くらべて「＞」「＝」「＜」をえらぼう！計算問題もあるよ！',
        icon: '⚖️',
        url: 'compare-game.html',
        theme: 'theme-green',
        ready: true
      },
      {
        id: 'seesaw-game',
        tag: 'つりあい・たしざん',
        title: 'つりあいシーソー！',
        desc: 'おもりをのせて シーソーを ぴったり水平にしよう！あといくつかな？',
        icon: '🎠',
        url: 'seesaw-game.html',
        theme: 'theme-cyan',
        ready: true
      },
      {
        id: 'monster-battle',
        tag: '連打・かずのぶんかい',
        title: 'ぴったりアタック！',
        desc: '+1・+5・+10ボタンを連打してモンスターのHPをぴったり0にしよう！',
        icon: '⚔️',
        url: 'monster-battle.html',
        theme: 'theme-red',
        ready: true
      },
      {
        id: 'bubble-pop',
        tag: 'かずの大小・ぐうき・10',
        title: 'かずバブル！',
        desc: 'ふわふわ浮かぶ数字のシャボン玉をお題にあわせてタップして割ろう！',
        icon: '🫧',
        url: 'bubble-pop.html',
        theme: 'theme-purple',
        ready: true
      },
      {
        id: 'coin-place',
        tag: 'くらいどり・10のまとまり',
        title: 'コインで100！',
        desc: '1コインを連打して10・100に進化させよう！おつかいミッションもあるよ！',
        icon: '🪙',
        url: 'coin-place.html',
        theme: 'theme-amber',
        ready: true
      },
      {
        id: 'clock-game',
        tag: 'とけい・じかん',
        title: 'とけいマスター！',
        desc: 'アナログ時計の針をまわして、お題の時間にぴったり合わせよう！',
        icon: '🕒',
        url: 'clock-game.html',
        theme: 'theme-teal',
        ready: true
      },
      {
        id: 'dagashi-shop',
        tag: 'おかね・おつり',
        title: 'だがしや おかいもの！',
        desc: 'お菓子の合計とおつりを計算して、レジのトレイにお金を並べよう！',
        icon: '🍬',
        url: 'dagashi-shop.html',
        theme: 'theme-pink',
        ready: true
      },
      {
        id: 'area-blocks',
        tag: 'ずけい・ひろさ',
        title: 'ひろさパズル！',
        desc: 'いろいろな形のブロックを方眼マスにならべて、お題の広さを作ろう！',
        icon: '🟦',
        url: 'area-blocks.html',
        theme: 'theme-indigo',
        ready: true
      }
    ];

    // アプリカード描画
    const grid = document.getElementById('app-grid');
    grid.innerHTML = APPS.map(app => {
      if (app.ready) {
        return `
          <a href="${app.url}" class="app-card ready ${app.theme}">
            <div>
              <div class="card-top">
                <div class="card-icon">${app.icon}</div>
                <div>
                  <span class="card-tag">${app.tag}</span>
                  <h2 class="card-title">${app.title}</h2>
                </div>
              </div>
              <p class="card-desc">${app.desc}</p>
            </div>
            <div class="card-btn">▶ あそぶ！</div>
          </a>
        `;
      }
      return `
        <div class="app-card coming-soon ${app.theme}">
          <div>
            <div class="card-top">
              <div class="card-icon">${app.icon}</div>
              <div>
                <span class="card-tag">${app.tag}</span>
                <h2 class="card-title">${app.title}</h2>
              </div>
            </div>
            <p class="card-desc">${app.desc}</p>
          </div>
          <div class="card-btn">じゅんびちゅう</div>
        </div>
      `;
    }).join('');

    // ハチハチジュウロクのセーブデータがあればステータス表示
    try {
      const raw = localStorage.getItem('KEISAN_ADVENTURE_SAVE_V1');
      if (raw) {
        const st = JSON.parse(raw);
        document.getElementById('st-coins').textContent = '🪙 ' + (st.coins || 0);
        document.getElementById('st-stars').textContent = '⭐ ' + (st.stars || 0);
        document.getElementById('st-solved').textContent = '🎯 ' + (st.totalSolved || 0) + 'もん';
        document.getElementById('portal-stats').style.display = 'inline-flex';
      }
    } catch (e) { }
  </script>
</body>

</html>
